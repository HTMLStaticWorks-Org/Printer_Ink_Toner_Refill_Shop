<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="labBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111E"/>
      <stop offset="55%" stop-color="#0F1C2E"/>
      <stop offset="100%" stop-color="#070D17"/>
    </linearGradient>
    <radialGradient id="cAura" cx="28%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mAura" cx="78%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="benchSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2639"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="drumGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fineGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="url(#labBg)"/>
  <rect width="1200" height="760" fill="url(#fineGrid)"/>
  <rect width="1200" height="760" fill="url(#cAura)"/>
  <rect width="1200" height="760" fill="url(#mAura)"/>

  <!-- Lab Bench -->
  <path d="M0 530 L1200 530 L1200 760 L0 760 Z" fill="url(#benchSurface)"/>
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Top Vacuum Ink Manifold Unit -->
  <g transform="translate(110,95)">
    <rect x="0" y="0" width="980" height="175" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="22" width="300" height="130" rx="12" fill="#131F33" stroke="#1E293B"/>
    <circle cx="84" cy="87" r="34" fill="#0E7490" fill-opacity="0.22" stroke="#22D3EE" stroke-width="2.5"/>
    <path d="M84 64 C74 77, 70 86, 70 93 A14 14 0 0 0 98 93 C98 86, 94 77, 84 64 Z" fill="#22D3EE"/>
    <rect x="138" y="54" width="160" height="12" rx="6" fill="#1E293B"/>
    <rect x="138" y="54" width="136" height="12" rx="6" fill="#22D3EE"/>
    <rect x="138" y="81" width="160" height="12" rx="6" fill="#1E293B"/>
    <rect x="138" y="81" width="122" height="12" rx="6" fill="#EC4899"/>
    <rect x="138" y="108" width="160" height="12" rx="6" fill="#1E293B"/>
    <rect x="138" y="108" width="146" height="12" rx="6" fill="#FACC15"/>

    <!-- 4 Precision Metered Ink Reservoirs -->
    <g transform="translate(360,26)">
      <rect x="0" y="0" width="125" height="122" rx="12" fill="#131F33" stroke="#22D3EE" stroke-width="1.8"/>
      <rect x="18" y="24" width="89" height="72" rx="6" fill="#0891B2"/>
      <rect x="18" y="24" width="26" height="72" rx="6" fill="url(#shine)"/>
      <text x="62" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#67E8F9" letter-spacing="1.5">CYAN</text>

      <rect x="150" y="0" width="125" height="122" rx="12" fill="#131F33" stroke="#EC4899" stroke-width="1.8"/>
      <rect x="168" y="24" width="89" height="72" rx="6" fill="#BE185D"/>
      <rect x="168" y="24" width="26" height="72" rx="6" fill="url(#shine)"/>
      <text x="212" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F9A8D4" letter-spacing="1.5">MAGENTA</text>

      <rect x="300" y="0" width="125" height="122" rx="12" fill="#131F33" stroke="#FACC15" stroke-width="1.8"/>
      <rect x="318" y="24" width="89" height="72" rx="6" fill="#EAB308"/>
      <rect x="318" y="24" width="26" height="72" rx="6" fill="url(#shine)"/>
      <text x="362" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FEF08A" letter-spacing="1.5">YELLOW</text>

      <rect x="450" y="0" width="125" height="122" rx="12" fill="#131F33" stroke="#94A3B8" stroke-width="1.8"/>
      <rect x="468" y="24" width="89" height="72" rx="6" fill="#334155"/>
      <rect x="468" y="24" width="26" height="72" rx="6" fill="url(#shine)"/>
      <text x="512" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">PIGMENT K</text>
    </g>

    <!-- Precision Feed Lines -->
    <path d="M422 175 C422 255, 220 265, 220 330" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
    <path d="M572 175 C572 255, 345 265, 345 330" fill="none" stroke="#EC4899" stroke-width="5" stroke-linecap="round"/>
    <path d="M722 175 C722 255, 470 265, 470 330" fill="none" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/>
    <path d="M872 175 C872 255, 595 265, 595 330" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 4 Inkjet Cartridges on Left-Center Dock -->
  <g transform="translate(275,425)">
    <rect x="-25" y="100" width="470" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="82" height="114" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <rect x="12" y="16" width="58" height="34" rx="4" fill="#0891B2"/>
      <rect x="26" y="70" width="30" height="24" rx="3" fill="url(#goldPin)"/>
    </g>
    <g transform="translate(115,0)">
      <rect x="0" y="0" width="82" height="114" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
      <rect x="12" y="16" width="58" height="34" rx="4" fill="#BE185D"/>
      <rect x="26" y="70" width="30" height="24" rx="3" fill="url(#goldPin)"/>
    </g>
    <g transform="translate(230,0)">
      <rect x="0" y="0" width="82" height="114" rx="10" fill="#1E293B" stroke="#FACC15" stroke-width="2"/>
      <rect x="12" y="16" width="58" height="34" rx="4" fill="#D97706"/>
      <rect x="26" y="70" width="30" height="24" rx="3" fill="url(#goldPin)"/>
    </g>
    <g transform="translate(345,0)">
      <rect x="0" y="0" width="82" height="114" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
      <rect x="12" y="16" width="58" height="34" rx="4" fill="#0F172A"/>
      <rect x="26" y="70" width="30" height="24" rx="3" fill="url(#goldPin)"/>
    </g>
  </g>

  <!-- Right Laser Toner Assembly & Test Print Card -->
  <g transform="translate(765,375)">
    <rect x="0" y="38" width="340" height="150" rx="18" fill="#1E293B" stroke="#64748B" stroke-width="2.2"/>
    <rect x="24" y="62" width="292" height="46" rx="23" fill="url(#drumGreen)"/>
    <rect x="24" y="122" width="195" height="46" rx="6" fill="#0F172A" stroke="#334155"/>
    <rect x="234" y="122" width="82" height="46" rx="6" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
    <rect x="258" y="133" width="34" height="24" rx="3" fill="url(#goldPin)"/>
    <rect x="95" y="12" width="150" height="26" rx="6" fill="#334155"/>
  </g>
</svg>
