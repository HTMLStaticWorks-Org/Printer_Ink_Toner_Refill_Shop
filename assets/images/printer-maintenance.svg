  <ellipse cx="400" cy="300" rx="280" ry="180" fill="url(#cyanGlow)"/>
  <g transform="translate(150,115)">
    <rect x="0" y="0" width="500" height="370" rx="20" fill="#1E293B" stroke="#475569" stroke-width="2.5"/>
    <rect x="40" y="40" width="420" height="120" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-width="1.8"/>
    <rect x="70" y="70" width="90" height="60" rx="6" fill="#0891B2"/>
    <rect x="180" y="70" width="90" height="60" rx="6" fill="#BE185D"/>
    <rect x="290" y="70" width="90" height="60" rx="6" fill="#EAB308"/>
    <rect x="40" y="190" width="420" height="140" rx="12" fill="#0B111A" stroke="#334155"/>
    <circle cx="140" cy="260" r="36" fill="none" stroke="#22D3EE" stroke-width="4"/>
    <circle cx="140" cy="260" r="14" fill="#22D3EE"/>
    <rect x="210" y="236" width="210" height="14" rx="4" fill="#94A3B8"/>
