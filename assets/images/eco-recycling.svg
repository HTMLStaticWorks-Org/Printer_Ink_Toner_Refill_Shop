    <circle cx="180" cy="185" r="78" fill="#10B981" fill-opacity="0.16" stroke="#34D399" stroke-width="3"/>
    <path d="M180 132 C152 156, 146 184, 158 212 C188 218, 214 196, 214 166 C214 150, 198 138, 180 132 Z" fill="#10B981"/>
