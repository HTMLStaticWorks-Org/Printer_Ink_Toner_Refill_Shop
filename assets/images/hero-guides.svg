<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B111A"/>
      <stop offset="55%" stop-color="#131E2E"/>
      <stop offset="100%" stop-color="#090E16"/>
    </linearGradient>
    <linearGradient id="bgSlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="opcDrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgDark)"/>
  <rect width="1600" height="900" fill="url(#gridPattern)"/>
  <ellipse cx="780" cy="430" rx="560" ry="300" fill="url(#cyanGlow)"/>
  <rect x="0" y="640" width="1600" height="260" fill="url(#deskGrad)"/>
  <!-- Calibration Sheet -->
  <g transform="translate(360,210)">
    <rect x="0" y="0" width="520" height="410" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="36" y="36" width="448" height="32" rx="4" fill="#0F172A"/>
    <rect x="36" y="92" width="100" height="160" rx="6" fill="#0891B2"/>
    <rect x="152" y="92" width="100" height="160" rx="6" fill="#BE185D"/>
    <rect x="268" y="92" width="100" height="160" rx="6" fill="#EAB308"/>
    <rect x="384" y="92" width="100" height="160" rx="6" fill="#0F172A"/>
    <rect x="36" y="276" width="448" height="14" rx="4" fill="#CBD5E1"/>
    <rect x="36" y="306" width="360" height="14" rx="4" fill="#CBD5E1"/>
    <rect x="36" y="336" width="280" height="14" rx="4" fill="#CBD5E1"/>
    <!-- Loupe magnifying ring -->
    <circle cx="380" cy="240" r="88" fill="#22D3EE" fill-opacity="0.12" stroke="#0E7490" stroke-width="10"/>
    <line x1="444" y1="304" x2="530" y2="390" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(990,490)">
