    <rect x="8" y="0" width="60" height="16" rx="4" fill="#334155"/>
    <rect x="10" y="24" width="56" height="44" rx="4" fill="#0F172A" stroke="#334155"/>
    <rect x="10" y="24" width="56" height="10" rx="2" fill="#0891B2"/>
    <text x="38" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F1F5F9">GUIDE</text>
    <rect x="24" y="80" width="28" height="22" rx="3" fill="url(#goldChip)"/>
    <line x1="28" y1="87" x2="48" y2="87" stroke="#713F12" stroke-width="1.2"/>
    <line x1="28" y1="95" x2="48" y2="95" stroke="#713F12" stroke-width="1.2"/>
    <line x1="38" y1="80" x2="38" y2="102" stroke="#713F12" stroke-width="1.2"/>
  </g>
  
  <g transform="translate(1100,490)">
    <rect x="0" y="10" width="76" height="106" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.8"/>
    <rect x="8" y="0" width="60" height="16" rx="4" fill="#334155"/>
    <rect x="10" y="24" width="56" height="44" rx="4" fill="#0F172A" stroke="#334155"/>
    <rect x="10" y="24" width="56" height="10" rx="2" fill="#BE185D"/>
    <text x="38" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F1F5F9">CALIB</text>
    <rect x="24" y="80" width="28" height="22" rx="3" fill="url(#goldChip)"/>
    <line x1="28" y1="87" x2="48" y2="87" stroke="#713F12" stroke-width="1.2"/>
    <line x1="28" y1="95" x2="48" y2="95" stroke="#713F12" stroke-width="1.2"/>
    <line x1="38" y1="80" x2="38" y2="102" stroke="#713F12" stroke-width="1.2"/>
  </g>
  
  <g transform="translate(1230,480)">
    <rect x="18" y="0" width="24" height="12" rx="2" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <path d="M22 12 L10 28 L10 120 Q10 126 16 126 L44 126 Q50 126 50 120 L50 28 L38 12 Z" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <rect x="13" y="42" width="34" height="78" rx="3" fill="#EAB308" opacity="0.9"/>
    <rect x="13" y="42" width="12" height="78" rx="3" fill="url(#glassShine)"/>
    <rect x="14" y="60" width="32" height="28" rx="2" fill="#F8FAFC" opacity="0.94"/>
    <rect x="14" y="60" width="32" height="6" fill="#CA8A04"/>
    <text x="30" y="79" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Y</text>
