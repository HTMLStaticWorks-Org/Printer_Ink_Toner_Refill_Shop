<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B111A"/>
      <stop offset="55%" stop-color="#131E2E"/>
      <stop offset="100%" stop-color="#090E16"/>
    </linearGradient>
    <linearGradient id="bgSlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="opcDrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgDark)"/>
  <rect width="1600" height="900" fill="url(#gridPattern)"/>
  <ellipse cx="800" cy="430" rx="580" ry="320" fill="url(#cyanGlow)"/>
  <rect x="0" y="630" width="1600" height="270" fill="url(#deskGrad)"/>
  <line x1="0" y1="630" x2="1600" y2="630" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2"/>
  <!-- 4 Service Pillars Visualized on Workbench -->
  <g transform="translate(180,310)">
    <!-- Vacuum chamber -->
    <rect x="0" y="40" width="260" height="280" rx="16" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
    <rect x="28" y="75" width="204" height="160" rx="10" fill="#131E2E" stroke="#334155"/>
    <circle cx="130" cy="155" r="46" fill="#0891B2" opacity="0.35" stroke="#22D3EE" stroke-width="2"/>
    <path d="M130 125 C115 142, 110 154, 110 164 A20 20 0 0 0 150 164 C150 154, 145 142, 130 125 Z" fill="#22D3EE"/>
    <rect x="40" y="258" width="180" height="32" rx="6" fill="#1E293B"/>
  </g>
  <g transform="translate(520,380)">
    <!-- Laser Toner Drum & Hopper -->
    <rect x="0" y="20" width="440" height="230" rx="18" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <rect x="30" y="55" width="380" height="65" rx="32" fill="url(#opcDrum)"/>
    <rect x="30" y="140" width="260" height="75" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="315" y="145" width="85" height="65" rx="8" fill="#0F172A" stroke="#475569"/>
    <rect x="342" y="164" width="32" height="26" rx="4" fill="url(#goldChip)"/>
  </g>
  <g transform="translate(1040,340)">
    <!-- Test Print Station -->
    <rect x="0" y="0" width="360" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="28" y="28" width="304" height="26" rx="4" fill="#0F172A"/>
    <rect x="28" y="72" width="68" height="120" rx="4" fill="#06B6D4"/>
    <rect x="106" y="72" width="68" height="120" rx="4" fill="#EC4899"/>
    <rect x="184" y="72" width="68" height="120" rx="4" fill="#EAB308"/>
    <rect x="262" y="72" width="70" height="120" rx="4" fill="#0F172A"/>
    <rect x="28" y="212" width="304" height="12" rx="3" fill="#CBD5E1"/>
    <rect x="28" y="236" width="240" height="12" rx="3" fill="#CBD5E1"/>
  </g>
</svg>
