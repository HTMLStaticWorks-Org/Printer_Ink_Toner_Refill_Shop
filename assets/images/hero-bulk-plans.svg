<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B111A"/>
      <stop offset="55%" stop-color="#131E2E"/>
      <stop offset="100%" stop-color="#090E16"/>
    </linearGradient>
    <linearGradient id="bgSlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="opcDrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgDark)"/>
  <rect width="1600" height="900" fill="url(#gridPattern)"/>
  <ellipse cx="800" cy="400" rx="600" ry="300" fill="url(#cyanGlow)"/>
  <rect x="0" y="640" width="1600" height="260" fill="url(#deskGrad)"/>
  <!-- Stacked Enterprise Toner Boxes -->
  <g transform="translate(190,260)">
    <rect x="0" y="250" width="260" height="130" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="275" width="80" height="16" rx="3" fill="#0891B2"/>
    <rect x="280" y="250" width="260" height="130" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="300" y="275" width="80" height="16" rx="3" fill="#BE185D"/>
    <rect x="40" y="110" width="240" height="130" rx="8" fill="#131E2E" stroke="#38BDF8" stroke-width="2"/>
    <rect x="60" y="135" width="80" height="16" rx="3" fill="#EAB308"/>
    <rect x="300" y="110" width="220" height="130" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="160" y="-25" width="220" height="125" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
    <rect x="180" y="0" width="70" height="14" rx="3" fill="#22D3EE"/>
  </g>
  <!-- Office Multifunction Printer -->
  <g transform="translate(880,220)">
    <rect x="40" y="0" width="420" height="90" rx="10" fill="#334155" stroke="#64748B" stroke-width="2"/>
    <rect x="0" y="80" width="500" height="230" rx="14" fill="#1E293B" stroke="#64748B" stroke-width="2.5"/>
    <rect x="36" y="115" width="280" height="55" rx="6" fill="#0F172A"/>
    <rect x="340" y="115" width="120" height="55" rx="8" fill="#0B111A" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="370" cy="142" r="10" fill="#22D3EE"/>
    <rect x="36" y="190" width="428" height="45" rx="6" fill="#0F172A" stroke="#334155"/>
    <rect x="36" y="250" width="428" height="45" rx="6" fill="#0F172A" stroke="#334155"/>
    <rect x="20" y="310" width="460" height="110" rx="10" fill="#131E2E" stroke="#475569" stroke-width="2"/>
  </g>
</svg>
