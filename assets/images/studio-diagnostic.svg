    <polyline points="60,210 140,160 220,185 310,95 400,120 460,65" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="310" cy="95" r="8" fill="#FACC15"/>
    <circle cx="460" cy="65" r="8" fill="#22D3EE"/>
    <rect x="30" y="285" width="140" height="40" rx="6" fill="#0891B2"/>
