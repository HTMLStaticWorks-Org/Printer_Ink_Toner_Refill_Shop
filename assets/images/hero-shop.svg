<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="h2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="50%" stop-color="#0C1726"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <radialGradient id="h2Spot" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0E7490" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h2Magenta" cx="80%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#DB2777" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h2Floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111C2D"/>
      <stop offset="100%" stop-color="#060B14"/>
    </linearGradient>
    <pattern id="h2Grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#h2Bg)"/>
  <rect width="1600" height="900" fill="url(#h2Grid)"/>
  <rect width="1600" height="900" fill="url(#h2Spot)"/>
  <rect width="1600" height="900" fill="url(#h2Magenta)"/>
  <!-- Architectural Studio Horizon -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#h2Floor)"/>
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.5"/>
  <!-- Left & Right Silhouette Studio Racks (keeps center quiet for white typography) -->
  <g opacity="0.45">
    <rect x="70" y="190" width="290" height="420" rx="16" fill="#0B1320" stroke="#1E293B" stroke-width="2"/>
    <rect x="105" y="235" width="220" height="72" rx="8" fill="#132238" stroke="#0891B2" stroke-width="1.2"/>
    <rect x="105" y="330" width="220" height="72" rx="8" fill="#132238" stroke="#BE185D" stroke-width="1.2"/>
    <rect x="105" y="425" width="220" height="72" rx="8" fill="#132238" stroke="#EAB308" stroke-width="1.2"/>
    <rect x="105" y="520" width="220" height="60" rx="8" fill="#132238" stroke="#475569"/>
    <rect x="1240" y="190" width="290" height="420" rx="16" fill="#0B1320" stroke="#1E293B" stroke-width="2"/>
    <rect x="1275" y="235" width="220" height="160" rx="10" fill="#132238" stroke="#22D3EE" stroke-width="1.2"/>
    <rect x="1275" y="420" width="102" height="150" rx="8" fill="#132238" stroke="#475569"/>
    <rect x="1393" y="420" width="102" height="150" rx="8" fill="#132238" stroke="#475569"/>
  </g>
