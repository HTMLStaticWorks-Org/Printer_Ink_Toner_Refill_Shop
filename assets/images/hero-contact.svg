<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B111A"/>
      <stop offset="55%" stop-color="#131E2E"/>
      <stop offset="100%" stop-color="#090E16"/>
    </linearGradient>
    <linearGradient id="bgSlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="opcDrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgDark)"/>
  <rect width="1600" height="900" fill="url(#gridPattern)"/>
  <ellipse cx="800" cy="400" rx="580" ry="300" fill="url(#cyanGlow)"/>
  <rect x="0" y="610" width="1600" height="290" fill="url(#deskGrad)"/>
  <!-- Modern Shop Front Desk & Drop-off Cradle -->
  <g transform="translate(260,260)">
    <rect x="0" y="0" width="1080" height="320" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="50" y="50" width="420" height="220" rx="12" fill="#131E2E" stroke="#22D3EE" stroke-width="1.8"/>
    <circle cx="130" cy="160" r="42" fill="#0891B2" opacity="0.25" stroke="#22D3EE" stroke-width="2"/>
    <polyline points="112,160 125,173 150,146" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="195" y="125" width="230" height="18" rx="4" fill="#F1F5F9" opacity="0.85"/>
    <rect x="195" y="158" width="180" height="14" rx="4" fill="#94A3B8" opacity="0.6"/>
    <rect x="195" y="186" width="140" height="14" rx="4" fill="#22D3EE" opacity="0.7"/>
    <!-- Drop-off slots -->
    <g transform="translate(530,50)">
      <rect x="0" y="0" width="490" height="220" rx="12" fill="#1E293B" stroke="#475569"/>
      <rect x="35" y="35" width="195" height="65" rx="8" fill="#0F172A" stroke="#0891B2"/>
      <rect x="260" y="35" width="195" height="65" rx="8" fill="#0F172A" stroke="#BE185D"/>
      <rect x="35" y="120" width="195" height="65" rx="8" fill="#0F172A" stroke="#EAB308"/>
      <rect x="260" y="120" width="195" height="65" rx="8" fill="#0F172A" stroke="#64748B"/>
    </g>
  </g>
</svg>
